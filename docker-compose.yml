services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: worldcup
      POSTGRES_PASSWORD: worldcup_pass
      POSTGRES_DB: worldcup
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worldcup"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    command: ["sh", "-c", "npx prisma db push && npm run dev"]
    volumes:
      - ./backend/src:/app/src
    environment:
      DATABASE_URL: postgresql://worldcup:worldcup_pass@postgres:5432/worldcup
      NODE_ENV: development
      FRONTEND_URL: http://localhost:3000
      JWT_SECRET: "${JWT_SECRET}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      ADMIN_EMAIL: "${ADMIN_EMAIL}"
      CRON_SECRET: "${CRON_SECRET}"
      FOOTBALL_API_KEY: "${FOOTBALL_API_KEY}"

volumes:
  pgdata:
